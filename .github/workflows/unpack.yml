name: Unpack source

on:
  push:
    paths:
      - source.zip

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack application
        run: |
          unzip -o source.zip
          rm source.zip
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add AI rewriter application"
          git push
