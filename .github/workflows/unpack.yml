name: Unpack source

on:
  push:
    paths:
      - source.zip
      - .github/workflows/unpack.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack application
        run: |
          unzip -o source.zip || test $? -eq 1
          rm source.zip
      - name: Commit source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add AI rewriter application"
          git push
